name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bin/agy-run
      - run: bash tests/agy-run.test.sh
      - run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json
